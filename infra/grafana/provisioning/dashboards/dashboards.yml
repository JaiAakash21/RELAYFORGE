apiVersion: 1

providers:
  - name: RelayForge
    orgId: 1
    folder: RelayForge
    type: file
    disableDeletion: false
    # Picks up edits to the JSON without restarting Grafana.
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
