name: End-to-end

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright against the full stack
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate secrets for this run
        # Real random values, not fixtures. The application refuses to start on
        # a placeholder key, which is exactly the behaviour being relied on.
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "RELAYFORGE_JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n')"
            echo "RELAYFORGE_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')"
            echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } >> .env

      - name: Build and start the stack
        run: docker compose up --build -d postgres redis kafka webhook-simulator api worker frontend

      - name: Wait for the stack to be ready
        # Polls readiness rather than sleeping a fixed time: a fixed sleep is
        # either too short on a slow runner or wasted on a fast one.
        run: |
          for i in $(seq 1 60); do
            api=$(curl -fsS http://localhost:8080/actuator/health/readiness 2>/dev/null || true)
            web=$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:3000/ 2>/dev/null || true)
            if echo "$api" | grep -q '"status":"UP"' && [ "$web" = "200" ]; then
              echo "stack ready after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::the stack did not become ready in 10 minutes"
          docker compose logs --tail=200
          exit 1

      - name: Install Playwright
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npx playwright test --trace off
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"

      - name: Collect stack logs on failure
        if: failure()
        run: docker compose logs --tail=500 > docker-compose-logs.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            docker-compose-logs.txt
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
