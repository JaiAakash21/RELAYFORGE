name: Security

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  schedule:
    # Weekly. A dependency that was clean when it was merged does not stay
    # clean, and nobody re-runs CI on an idle branch to find out.
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret that was committed and later removed is
          # still in the history and still compromised.
          fetch-depth: 0

      - name: Scan for committed secrets
        run: |
          set -uo pipefail
          echo "Scanning the working tree for credential-shaped strings…"

          # Patterns for the credentials this project actually issues, plus the
          # common third-party formats. Deliberately narrow: a grep for
          # "password" matches every doc page and teaches people to ignore it.
          patterns=(
            'rf_live_[A-Za-z0-9]{6,}_[A-Za-z0-9_-]{20,}'
            'whsec_[A-Za-z0-9_-]{30,}'
            'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.'
            'AKIA[0-9A-Z]{16}'
            'ghp_[A-Za-z0-9]{36}'
            '-----BEGIN [A-Z ]*PRIVATE KEY-----'
          )

          found=0
          for pattern in "${patterns[@]}"; do
            # Exclude the places where a *placeholder* legitimately appears.
            if matches=$(grep -rInE "$pattern" . \
                  --exclude-dir=.git \
                  --exclude-dir=node_modules \
                  --exclude-dir=target \
                  --exclude-dir=.next \
                  --exclude='*.lock' \
                  --exclude='package-lock.json' 2>/dev/null); then
              echo "::error::possible committed secret matching /$pattern/"
              echo "$matches"
              found=1
            fi
          done

          # .env must never be committed; .env.example must contain only
          # placeholders.
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git"
            found=1
          fi
          if [ -f .env.example ] && ! grep -q 'CHANGE_ME' .env.example; then
            echo "::error::.env.example no longer contains placeholders — a real value may have been committed"
            found=1
          fi

          if [ "$found" -eq 0 ]; then
            echo "No committed secrets found."
          fi
          exit "$found"

  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    # Only meaningful on a pull request: it compares the base and head manifests.
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  maven-audit:
    name: Maven dependency report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: List dependencies that have newer versions
        # Reported, not enforced. Failing a build because a transitive
        # dependency published a patch an hour ago trains people to ignore the
        # job, which is worse than not having it.
        run: mvn -B -ntp versions:display-dependency-updates || true

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        # --omit=dev: a vulnerability in a build-time tool is worth knowing
        # about but does not ship, and mixing the two makes the signal useless.
        run: npm audit --omit=dev --audit-level=high
