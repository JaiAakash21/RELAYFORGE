name: Backend

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "backend/**"
      - "webhook-simulator/**"
      - "pom.xml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "webhook-simulator/**"
      - "pom.xml"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref. Integration tests are
# slow, and finishing a run for a commit nobody will look at wastes a runner.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          # Caches ~/.m2 keyed on the POMs, so a run that changes no dependency
          # does not re-resolve them.
          cache: maven

      - name: Compile
        run: mvn -B -ntp compile

      - name: Unit tests
        # Surefire only. The integration tests need Docker and run in their own
        # job, so a logic error surfaces in two minutes rather than fifteen.
        run: mvn -B -ntp test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: backend/target/surefire-reports/
          retention-days: 7

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers starts PostgreSQL, Redis and Kafka. GitHub's ubuntu
      # runners ship Docker, so no setup step is needed — but pulling the images
      # up front keeps the first test from absorbing the pull time and timing
      # out.
      - name: Pre-pull container images
        run: |
          docker pull postgres:16-alpine &
          docker pull redis:7.4-alpine &
          docker pull apache/kafka:3.9.1 &
          wait

      - name: Integration tests
        run: mvn -B -ntp verify
        env:
          # Reuse is off in CI: every run starts clean, and a reused container
          # would carry state between runs.
          TESTCONTAINERS_REUSE_ENABLE: "false"

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: backend/target/failsafe-reports/
          retention-days: 7

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [unit]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jars
        run: mvn -B -ntp -DskipTests package

      - name: Verify the jars are runnable
        # Catches a packaging error that compilation cannot: a missing main
        # class, a broken layer index, an unresolvable nested dependency.
        run: |
          java -Djarmode=layertools -jar backend/target/relayforge-backend.jar list
          test -f webhook-simulator/target/relayforge-webhook-simulator.jar

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            backend/target/relayforge-backend.jar
            webhook-simulator/target/relayforge-webhook-simulator.jar
          retention-days: 7
