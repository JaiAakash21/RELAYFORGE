# =============================================================================
# RelayForge webhook simulator.
#
# A controlled, deliberately misbehaving webhook receiver. It makes no outbound
# requests and is reachable only from inside the Docker network.
# =============================================================================
server:
  port: 8081
  # Keep request handling bounded: the SLOW_RESPONSE scenario parks threads on
  # purpose, and without a cap a demo could exhaust the connector's pool.
  tomcat:
    threads:
      max: 50
    max-connections: 200
    connection-timeout: 20s
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: relayforge-webhook-simulator
  mvc:
    problemdetails:
      enabled: false
  threads:
    virtual:
      # Virtual threads make the SLOW_RESPONSE scenario cheap: a blocked
      # Thread.sleep no longer pins a platform thread.
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.relayforge.simulator: INFO
